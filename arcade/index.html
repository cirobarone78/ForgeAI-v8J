<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕹 Il mio Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0a0a0f; --surface:#14141d; --surface2:#1c1c28;
    --text:#fff; --dim:rgba(255,255,255,0.45);
    --accent:#FF9F1C; --green:#10B981;
    --radius:18px;
  }
  body {
    font-family:'Outfit',system-ui,sans-serif;
    background:
      radial-gradient(ellipse 70% 40% at 50% -10%, rgba(255,159,28,0.12), transparent),
      var(--bg);
    color:var(--text); min-height:100vh; padding:32px 20px 60px;
  }
  header { max-width:1080px; margin:0 auto 32px; text-align:center; }
  h1 {
    font-size:clamp(28px,5vw,44px); font-weight:800; letter-spacing:-0.02em;
    background:linear-gradient(120deg,#fff 30%,var(--accent));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .sub { color:var(--dim); font-size:14px; margin-top:8px; }
  .sub strong { color:var(--accent); }
  .grid {
    max-width:1080px; margin:0 auto; display:grid; gap:22px;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  }
  .card {
    background:var(--surface); border:1px solid rgba(255,255,255,0.07);
    border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column;
    transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .card:hover {
    transform:translateY(-4px); border-color:rgba(255,159,28,0.4);
    box-shadow:0 16px 40px rgba(0,0,0,0.5);
  }
  .thumb {
    position:relative; aspect-ratio:16/10; overflow:hidden; background:var(--surface2);
  }
  .thumb iframe {
    width:455%; height:455%;
    transform:scale(0.22); transform-origin:0 0;
    border:none; pointer-events:none;
  }
  .thumb .cover { position:absolute; inset:0; display:block; }
  .thumb .fallback {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:52px; background:linear-gradient(135deg,#1c1c28,#252533);
  }
  .meta { padding:14px 16px 4px; flex:1; }
  .t { font-size:16px; font-weight:600; }
  .d { font-size:12px; color:var(--dim); margin-top:3px; }
  .actions { padding:12px 16px 16px; }
  .play {
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:10px; border-radius:9999px; text-decoration:none;
    background:rgba(16,185,129,0.12); border:1px solid rgba(16,185,129,0.35);
    color:var(--green); font-weight:600; font-size:14px;
    transition:background .2s ease;
  }
  .play:hover { background:rgba(16,185,129,0.25); }
  .empty {
    max-width:420px; margin:80px auto; text-align:center; color:var(--dim);
    font-size:15px; line-height:1.7;
  }
  .empty .big { font-size:56px; margin-bottom:12px; }
  footer { text-align:center; margin-top:48px; color:rgba(255,255,255,0.25); font-size:12px; }
  footer a { color:rgba(255,159,28,0.6); text-decoration:none; }
</style>
</head>
<body>
<header>
  <h1>🕹 Il mio Arcade</h1>
  <div class="sub" id="sub">Caricamento…</div>
</header>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">
  <div class="big">🕹</div>
  Nessun gioco ancora pubblicato.<br>
  Crea un gioco con ForgeAI e premi <strong style="color:#10B981">🌍 Pubblica</strong>: apparirà qui.
</div>
<footer>Creato con <a href="https://github.com/cirobarone78/ForgeAI-v8J" target="_blank">⚡ ForgeAI</a></footer>

<script>
(async () => {
  const grid = document.getElementById('grid');
  const sub = document.getElementById('sub');
  const empty = document.getElementById('empty');
  let data = { games: [] };
  try {
    const r = await fetch('games.json?t=' + Date.now());
    if (r.ok) data = await r.json();
  } catch (e) { /* pagina appena creata */ }

  const games = Array.isArray(data.games) ? data.games : [];
  if (!games.length) {
    sub.textContent = 'La collezione è vuota';
    empty.style.display = 'block';
    return;
  }
  sub.innerHTML = '<strong>' + games.length + '</strong> ' + (games.length === 1 ? 'gioco' : 'giochi') + ' — tocca una card per giocare';

  const fmtDate = (iso) => {
    try { return new Date(iso).toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' }); }
    catch { return ''; }
  };

  grid.innerHTML = games.map(g => `
    <div class="card">
      <div class="thumb">
        <div class="fallback">🎮</div>
        <iframe src="${g.url}" loading="lazy" tabindex="-1" title="${g.name}"></iframe>
        <a class="cover" href="${g.url}" target="_blank" aria-label="Gioca a ${g.name}"></a>
      </div>
      <div class="meta">
        <div class="t">${g.name}</div>
        <div class="d">${fmtDate(g.updatedAt || g.addedAt)}</div>
      </div>
      <div class="actions">
        <a class="play" href="${g.url}" target="_blank">▶ Gioca</a>
      </div>
    </div>`).join('');
})();
</script>
</body>
</html>
